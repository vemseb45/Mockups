<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - BarberTech</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container">
    <h1 class="title">Registro</h1>

    <form class="form">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder= "Nombre" required>

      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" name="apellido" placeholder= "Apellido" required>

      <label for="Telefono">Telefono</label>
      <input type="Telefono" id="Telefono" name="Telefono" placeholder= "Telefono" required>

      <label for="Correo Electronico">Correo Electronico</label>
      <input type="Correo Electronico" id="Correo Electronico" name="Correo Electronico" placeholder= "Correo Electronico" required>

      <label for="Cedula">Cedula</label>
      <input type="Cedula" id="Cedula" name="Cedula" placeholder= "Cedula" required>

        <label for="Contraseña">Contraseña</label>
      <input type="Contraseña" id="Contraseña" name="Contraseña" placeholder= "Contraseña" required>

      <button type="submit">Registrarse</button>
    </form>
  </div>

</body>
</html>
